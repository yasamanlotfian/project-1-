syntax = "proto3";

package user;

service UserService {
    rpc GetUsers (Empty) returns (UserList);
    rpc GetUser (UserRequest) returns (UserResponse);
    rpc CreateUser (CreateUserRequest) returns (UserResponse);
    rpc UpdateUser (UpdateUserRequest) returns (UserResponse);
    rpc DeleteUser (UserRequest) returns (DeleteResponse);
    rpc Login (LoginRequest) returns (LoginResponse);
}

message Empty {
}

message UserRequest {
    int32 user_id = 1;
}

message CreateUserRequest {
    string username = 1;
    string email = 2;
    string password = 3;
}

message UpdateUserRequest {
    int32 user_id = 1;
    string username = 2;
    string email = 3;
    string password = 4;
    string role = 5;
}

message UserResponse {
    int32 id = 1;
    string username = 2;
    string email = 3;
    string role = 4;
    string created_at = 5;
    string updated_at = 6;
}

message UserList {
    repeated UserResponse users = 1;
}

message DeleteResponse {
    bool success = 1;
    string message = 2;
}

message LoginRequest {
    string username = 1;
    string password = 2;
}

message LoginResponse {
    string access_token = 1;
    string token_type = 2;
}
